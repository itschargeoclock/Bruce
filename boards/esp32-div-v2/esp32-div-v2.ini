[env:esp32-div-v2]
platform = espressif32
board = esp32-div-v2
framework = arduino
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/esp32-div-v2>
build_flags =
	${env.build_flags}
	-Iboards/esp32-div-v2
	-DESP32_DIV_V2=1
	-DCORE_DEBUG_LEVEL=5
	-DHAS_RGB_LED=1
	-DRGB_LED=1
	-DHAS_BUZZER=1
	-DBUZZER_PIN=2
	-DLED=1
	-DGROVE_SDA=8
	-DGROVE_SCL=9
	-DHAS_SCREEN=1
	-DROTATION=1
	-DBACKLIGHT=7
	-DMINBRIGHT=1
	-DUSER_SETUP_LOADED=1
	-DILI9341_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_BACKLIGHT_ON=1
	-DTFT_BL=7
	-DTFT_RST=-1
	-DTFT_DC=16
	-DTFT_MOSI=35
	-DTFT_SCLK=36
	-DTFT_CS=17
	-DTFT_MISO=37
	-DTOUCH_CS=18
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=25000000
	-DSDCARD_CS=10
	-DSDCARD_SCK=12
	-DSDCARD_MISO=13
	-DSDCARD_MOSI=11
	-DUSE_CC1101_VIA_SPI
	-DCC1101_GDO0_PIN=6
	-DCC1101_SS_PIN=5
	-DCC1101_MOSI_PIN=11
	-DCC1101_SCK_PIN=12
	-DCC1101_MISO_PIN=13
	-DCC1101_GDO2_PIN=3
	-DUSE_NRF24_VIA_SPI
	-DNRF24_CE_PIN=15
	-DNRF24_SS_PIN=4
	-DNRF24_MOSI_PIN=11
	-DNRF24_SCK_PIN=12
	-DNRF24_MISO_PIN=13
	-DNRF24_2_CE=47
	-DNRF24_2_CSN=48
	-DNRF24_3_CE=14
	-DNRF24_3_CSN=21
